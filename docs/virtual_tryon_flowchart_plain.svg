<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1420" viewBox="0 0 1300 1420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .round { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .diamond { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; font-size: 22px; fill: #000000; }
      .small { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; font-size: 18px; fill: #000000; }
      .line { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1300" height="1420"/>

  <rect class="round" x="525" y="20" width="250" height="58" rx="29"/>
  <text class="text" x="650" y="58" text-anchor="middle">开始</text>

  <path class="line" d="M650 78 L650 112"/>
  <rect class="box" x="450" y="112" width="400" height="66" rx="4"/>
  <text class="text" x="650" y="153" text-anchor="middle">用户上传人物图片</text>

  <path class="line" d="M650 178 L650 218"/>
  <polygon class="diamond" points="650,218 820,310 650,402 480,310"/>
  <text class="text" x="650" y="304" text-anchor="middle">选择服装来源</text>
  <text class="small" x="650" y="332" text-anchor="middle">上传图片或衣橱单品</text>

  <path class="line" d="M480 310 L315 310 L315 365"/>
  <text class="small" x="390" y="298" text-anchor="middle">上传服装图</text>
  <rect class="box" x="150" y="365" width="330" height="72" rx="4"/>
  <text class="text" x="315" y="394" text-anchor="middle">上传服装图片</text>
  <text class="small" x="315" y="422" text-anchor="middle">生成临时衣橱单品</text>

  <path class="line" d="M820 310 L985 310 L985 365"/>
  <text class="small" x="910" y="298" text-anchor="middle">选择衣橱</text>
  <rect class="box" x="820" y="365" width="330" height="72" rx="4"/>
  <text class="text" x="985" y="394" text-anchor="middle">读取衣橱单品信息</text>
  <text class="small" x="985" y="422" text-anchor="middle">获取服装路径与地址</text>

  <path class="line" d="M315 437 L315 495 L650 495"/>
  <path class="line" d="M985 437 L985 495 L650 495"/>
  <path class="line" d="M650 402 L650 495"/>

  <rect class="box" x="450" y="495" width="400" height="72" rx="4"/>
  <text class="text" x="650" y="524" text-anchor="middle">前端提交试衣请求</text>
  <text class="small" x="650" y="552" text-anchor="middle">人物图、服装图或衣橱编号</text>

  <path class="line" d="M650 567 L650 605"/>
  <rect class="box" x="450" y="605" width="400" height="72" rx="4"/>
  <text class="text" x="650" y="634" text-anchor="middle">后端接收并校验参数</text>
  <text class="small" x="650" y="662" text-anchor="middle">检查人物图与服装来源</text>

  <path class="line" d="M650 677 L650 715"/>
  <rect class="box" x="450" y="715" width="400" height="72" rx="4"/>
  <text class="text" x="650" y="744" text-anchor="middle">保存人物图与服装图</text>
  <text class="small" x="650" y="772" text-anchor="middle">生成本地路径和访问地址</text>

  <path class="line" d="M650 787 L650 825"/>
  <polygon class="diamond" points="650,825 825,917 650,1009 475,917"/>
  <text class="text" x="650" y="911" text-anchor="middle">远程试衣服务</text>
  <text class="small" x="650" y="939" text-anchor="middle">是否可用并成功？</text>

  <path class="line" d="M825 917 L990 917 L990 965"/>
  <text class="small" x="905" y="904" text-anchor="middle">否</text>
  <rect class="box" x="830" y="965" width="320" height="72" rx="4"/>
  <text class="text" x="990" y="994" text-anchor="middle">生成占位试衣结果</text>
  <text class="small" x="990" y="1022" text-anchor="middle">返回原人物图作为结果图</text>

  <path class="line" d="M650 1009 L650 1048"/>
  <text class="small" x="675" y="1033">是</text>
  <rect class="box" x="450" y="1048" width="400" height="72" rx="4"/>
  <text class="text" x="650" y="1077" text-anchor="middle">接收试衣服务返回结果</text>
  <text class="small" x="650" y="1105" text-anchor="middle">下载或解析结果图片地址</text>

  <path class="line" d="M990 1037 L990 1155 L850 1155"/>
  <path class="line" d="M650 1120 L650 1155"/>
  <rect class="box" x="450" y="1155" width="400" height="72" rx="4"/>
  <text class="text" x="650" y="1184" text-anchor="middle">保存试衣记录</text>
  <text class="small" x="650" y="1212" text-anchor="middle">返回状态、提示和结果图地址</text>

  <path class="line" d="M650 1227 L650 1270"/>
  <rect class="box" x="490" y="1270" width="320" height="72" rx="4"/>
  <text class="text" x="650" y="1299" text-anchor="middle">前端展示试衣结果</text>
  <text class="small" x="650" y="1327" text-anchor="middle">更新页面与历史记录</text>

  <path class="line" d="M650 1342 L650 1372"/>
  <rect class="round" x="525" y="1372" width="250" height="58" rx="29"/>
  <text class="text" x="650" y="1410" text-anchor="middle">结束</text>
</svg>
